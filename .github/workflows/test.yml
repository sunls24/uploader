name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun --bun run build
        working-directory: web
      - run: go test -race ./...
